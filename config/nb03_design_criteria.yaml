    doi: 10.1002/ps.6937
    organism_system: "Dalbulus maidis; BicC dsRNA"
    verified_scope: "Table S1 provided by the user as the primary supplementary file (sha256 0d235a577ed7ac5782a90e07cdb6679db1ecf2da4d0e9bc79e37bf377b0bc4be); the article text was not read by the agent"
    verified_claims: "BicC_Fw / BicC_Rv, the T7 versions (15 nt partial T7 sequence added) for dsRNA synthesis, and the reported amplicon lengths 372 bp and 402 bp"
    transferability_to_d_maidis: "Direct (same species and target)"
  - id: dalaison2023_table_s1
    citation: "Dalaison-Fuentes LI et al. 2023. Pestic Biochem Physiol 196:105618. Supplementary Table S1 (PDF)"
    doi: 10.1016/j.pestbp.2023.105618
    organism_system: "Dalbulus maidis"
    verified_scope: "local PDF text layer, sha256 b2859b4ad39383136fd73c0e7623c095d3b5324da1547385eca215268d6fe429"
    verified_claims: "the same BicC primers and the same 372 / 402 bp lengths; corroboration only, not evidence of what was used in 2022"
    transferability_to_d_maidis: "Direct (same species and target)"
  - id: bolognesi2012
