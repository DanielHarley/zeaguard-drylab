# NB03 design-criteria registry (pre-registration).
#
# Frozen BEFORE any candidate window is generated. Roles, thresholds and the prioritization policy are read
# from this file by zeaguard.nb03_criteria; changing a criterion after results are seen requires a dated
# amendment (see `amendments`), never a silent edit. Nothing here is a score, a weight or a post-hoc threshold.
schema_version: 1
registry: nb03_design_criteria
version: 1
date: "2026-10-08"
status: PRE_REGISTERED

objective: >-
  Rational selection of candidate regions for a nominal 400 nt dsRNA against Dmai-BicC, inside the operational CDS
  only, with the published BicC dsRNA fragment kept as a separate reference-set benchmark. The nominal length is a
  PROJECT_CONVENTION, not a biological optimum. Specificity is read for interpretability of the BicC effect, not as a
  safety claim.

vocabulary:
  evidence_categories: [EVIDENCE_BACKED, TOOL_DERIVED, PROJECT_CONVENTION, OPERATIONAL_ASSUMPTION]
  roles:
    - HARD_FILTER
    - SOFT_PREFERENCE
    - DESCRIPTOR
    - TIE_BREAKER
    - MANUAL_REVIEW_TRIGGER
    - MANDATORY_PRE_RECOMMENDATION_MANUAL_REVIEW
  affects: [eligibility, comparison_scope, pareto, cell_signature, primary_ordering, shortlist_gate]
  unit_roles: [KNOWN_COMPATIBLE_EXCLUDED_FROM_RISK, DECISIONAL_INTERPRETABILITY, CO_TARGET_DECISIONAL_INTERPRETABILITY, DESCRIPTIVE_ONLY, DESCRIPTIVE_PLUS_MANUAL_REVIEW]
  statement_categories: [OBSERVATION, INFERENCE, HYPOTHESIS, PROJECT_CONVENTION, OPERATIONAL_ASSUMPTION]

evidence_sources:
  - id: dalaison2022_table_s1
