    all_tuning_candidates_demonstrably_failed: FAILED
    characterized: Interpretable completed evidence with obligations applicable to
      role and scope satisfied, required characterizations recorded, and provenance
      to declared configuration/domain/fixtures. TUNING does not grant final QA-P
      or G1.
    failed: Demonstrated blocking QA failure or invalid necessary execution, localized
      to configuration and scope. Non-recovery of CHARACTERIZED_NOT_ASSERTED alone
      is not failure.
    inconclusive: Informative execution occurred but necessary evidence is incomplete,
      insufficient or unresolved, without a demonstrated blocking failure that already
      determines FAILED for that same result. No PASS, absence or G1 freeze follows.
