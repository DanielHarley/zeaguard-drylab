schema_version: 2

platform:
  allowed_systems: ["Linux"]

python:
  spec: ">=3.12,<3.13"

python_dependencies:
  - {distribution: PyYAML, module: yaml}
  - {distribution: jsonschema, module: jsonschema}
  - {distribution: packaging, module: packaging}

external_tools:
  - name: blastn
    command: ["blastn", "-version"]
    version_regex: "blastn:\\s+([0-9.]+)"
    min_version: "2.14.0"
  - name: makeblastdb
    command: ["makeblastdb", "-version"]
    version_regex: "makeblastdb:\\s+([0-9.]+)"
    min_version: "2.14.0"
  - name: hmmscan
    command: ["hmmscan", "-h"]
    version_regex: "HMMER\\s+([0-9.]+)"
    min_version: "3.3"
  - name: hmmpress
    command: ["hmmpress", "-h"]
    version_regex: "HMMER\\s+([0-9.]+)"
    min_version: "3.3"
  - name: dustmasker
    command: ["dustmasker", "-version"]
    version_regex: "dustmasker:\\s+([0-9.]+)"
    min_version: "1.0.0"

required_paths:
  - src/workstreams/bioinformatics/notebooks/00_reproducibility_gate.ipynb
  - src/workstreams/bioinformatics/notebooks/01_reference_dataset_and_target_identity.ipynb
  - src/workstreams/bioinformatics/notebooks/02_dsrnase2_dsrna_candidate_regions.ipynb
  - src/workstreams/evidence/evidence_database.xlsx
  - src/zeaguard
  - config/project.yaml
  - data/reference/manifest.json
  - data/reference/target_anchors.tsv
  - data/reference/target_anchor_sequences.fasta
  - data/reference/nb01_dsrnase2_operational_reference.json
  - config/nb02_design_criteria.yaml
  - config/nb02_manual_review_decisions.tsv
  - config/nb02_candidate_limitations.tsv
  - data/reference/nb02_dsrnase2_candidate_regions.tsv
  - data/reference/nb02_dsrnase2_candidate_regions.fasta
  - data/reference/nb01_bicc_operational_reference.json
  - config/nb03_design_criteria.yaml
  - config/nb03_unit_membership_decisions.tsv
  - environment.yml
  - pyproject.toml

supporting_configs:
  - config/project.yaml

snapshot_dir: artifacts/reproducibility

checkpoint_required_paths:
  nb04_cp0:
    - config/nb04_nto_policy.yaml
    - config/nb04_nto_panel.tsv
    - config/nb04_exposure_scenarios.tsv
    - config/nb04_receptor_exposure.tsv
    - data/reference/nb04_nto_queries.tsv
    - data/reference/nb04_nto_queries.fasta
    - results/bioinformatics/nb04/cp0/resource_landscape.tsv
    - data/reference/nb04_cp0_complementary_contract.json
    - src/workstreams/bioinformatics/runs/2026-10-14_nb04-cp0-complementary-contract-patch.md
