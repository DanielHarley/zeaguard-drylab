[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeaguard"
version = "0.0.1"
description = "Reproducibility helpers for the ZeaGuard dry lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML",
    "jsonschema",
    "packaging",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
