name: zeaguard

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - pip
  - pyyaml
  - jsonschema
  - packaging

  # Required by the first target-retrieval workflow.
  - blast>=2.14
  - hmmer>=3.3

  # Required by the NB01 splice-aware junction check. Pinned: the recorded
  # alignment was produced by 2.31-r1302 and the check verifies that version.
  - minimap2=2.31

  # Required by the NB01 dsRNase-3 transcript-evidence recipe, which turns
  # RNA-seq reads into the materialised SAM that command counts. Pinned: the
  # anchor-recovery measurement that sets min_anchor_nt was made with these
  # versions, and every recipe run records them.
  - hisat2=2.2.1
  - samtools=1.21

  # Development and notebook execution.
  - pytest
  - jupyter
  - ipykernel
  - nbconvert
